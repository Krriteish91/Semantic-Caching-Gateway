services:
  api:
    build: .
    container_name: semantic-cache-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - .:/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: semantic-cache-redis

    ports:
      - "6379:6379"
  qdrant:
    image: qdrant/qdrant:latest
    container_name: semantic-cache-qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_storage:/qdrant/storage
volumes:
  qdrant_storage: